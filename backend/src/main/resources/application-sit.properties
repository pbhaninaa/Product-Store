# SIT - system integration (in-memory H2). Branch: SIT
# Local/CI only - not for Railway MySQL.

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:productstore_sit;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sit
spring.datasource.password=sit

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

app.auth.jwtSecret=${APP_JWT_SECRET:sit-jwt-secret-key-at-least-32-characters-long!!}
app.auth.jwtIssuer=${JWT_ISSUER:productstore}
app.auth.jwtAudience=${JWT_AUDIENCE:productstore-web}

app.email.domain=${EMAIL_DOMAIN:}
app.email.from=${EMAIL_FROM:no-reply@localhost}
sendgrid.apiKey=${SENDGRID_API_KEY:}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.twilio.sendgrid.api-url=${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
app.twilio.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-base-url=${PUBLIC_APP_BASE_URL:http://localhost:8085}
app.password-reset.token-ttl-hours=${PASSWORD_RESET_TOKEN_TTL_HOURS:24}
app.uploads.dir=${UPLOADS_DIR:./data/uploads}

# SIT-only demo accounts (provider + client). Never enable on local / UAT / PROD.
app.bootstrap.platformAdmin.email=${PLATFORM_ADMIN_EMAIL:pbhanina@gmail.com}
app.bootstrap.platformAdmin.password=${PLATFORM_ADMIN_PASSWORD:Philas@12}
app.bootstrap.platformAdmin.syncPassword=${PLATFORM_ADMIN_SYNC_PASSWORD:false}
app.bootstrap.demoMerchant.enabled=true
app.bootstrap.demoMerchant.ownerEmail=${DEMO_MERCHANT_EMAIL:demo@localhost}
app.bootstrap.demoMerchant.ownerPassword=${DEMO_MERCHANT_PASSWORD:Demo@123456}
app.bootstrap.demoClient.enabled=true
app.bootstrap.demoClient.email=${DEMO_CLIENT_EMAIL:client@localhost}
app.bootstrap.demoClient.password=${DEMO_CLIENT_PASSWORD:Client@123456}
app.bootstrap.demoClient.displayName=${DEMO_CLIENT_NAME:Demo Client}

logging.level.com.productstore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

peach.enabled=${PEACH_ENABLED:false}
peach.sandbox=${PEACH_SANDBOX:true}
peach.client-id=${PEACH_CLIENT_ID:}
peach.client-secret=${PEACH_CLIENT_SECRET:}
peach.merchant-id=${PEACH_MERCHANT_ID:}
peach.entity-id=${PEACH_ENTITY_ID:}
peach.secret-token=${PEACH_SECRET_TOKEN:${PEACH_WEBHOOK_SECRET:}}

payfast.enabled=${PAYFAST_ENABLED:false}
payfast.sandbox=${PAYFAST_SANDBOX:true}
payfast.merchant-id=${PAYFAST_MERCHANT_ID:}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:}
payfast.passphrase=${PAYFAST_PASSPHRASE:}
payfast.public-base-url=${PAYFAST_PUBLIC_BASE_URL:}
