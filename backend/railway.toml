# Railway: set Root Directory = backend
# Do not override Start Command - Dockerfile ENTRYPOINT runs the JAR.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only — avoids deploy failures when DB readiness is slow/flaky.
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
