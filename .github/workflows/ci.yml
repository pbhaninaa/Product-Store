name: CI

# Test gate for every push/PR on the promotion branches and feature branches.
# Deploys stay on Railway (backend) and Vercel (frontend); this only proves the code is green.
on:
  push:
    branches: [SIT, UAT, PROD, 'feature/**']
  pull_request:
    branches: [SIT, UAT, PROD]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B -ntp test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx vue-cli-service lint --no-fix
      - name: Unit, integration and regression tests
        run: npm test
      - name: Build (SIT mode)
        run: npm run build:sit

  mobile:
    name: Mobile (type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      # ESLint is not gated yet: the mobile app has pre-existing lint errors to clean up first.
      - name: Tests
        run: npx jest --ci
