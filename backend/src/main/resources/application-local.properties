# Secrets: optional gitignored backend/.env.sit (Twilio, etc.)
spring.config.import=optional:file:.env.sit[.properties]

server.port=8080

# MySQL (Local / SIT)
# DB name: Product-site
spring.datasource.url=jdbc:mysql://localhost:3306/Product-site?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Philas@12

app.auth.jwtSecret=${JWT_SECRET:dev-only-change-me}
app.auth.jwtIssuer=${JWT_ISSUER:productstore}
app.auth.jwtAudience=${JWT_AUDIENCE:productstore-web}

# Local SMTP (use MailHog or similar)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.email.from=${EMAIL_FROM:no-reply@localhost}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
sendgrid.apiKey=${SENDGRID_API_KEY:}
app.twilio.sendgrid.api-url=${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
app.twilio.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Bootstrap Platform Admin (Local only)
app.bootstrap.platformAdmin.email=pbhanina@gmail.com
app.bootstrap.platformAdmin.password=Philas@12

# Demo merchant seed (Local only — matches SPA default /m/demo)
app.bootstrap.demoMerchant.enabled=true
app.bootstrap.demoMerchant.slug=demo
app.bootstrap.demoMerchant.displayName=Demo Store
app.bootstrap.demoMerchant.ownerEmail=demo-merchant@localhost
app.bootstrap.demoMerchant.ownerPassword=Demo@123456

app.public-base-url=http://localhost:8080

