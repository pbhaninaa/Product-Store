# Copy to application-local.properties (gitignored) and fill in your local MySQL password.
# Secrets: optional gitignored backend/.env.sit (Twilio, etc.)
spring.config.import=optional:file:.env.sit[.properties]

server.port=${PORT:8080}
server.address=0.0.0.0

# MySQL (Local / SIT)
# DB name: Product-site
spring.datasource.url=jdbc:mysql://localhost:3306/Product-site?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${LOCAL_DB_PASSWORD:change-me}

app.auth.jwtSecret=${APP_JWT_SECRET:${JWT_SECRET:dev-only-change-me-local-secret-32-chars-min}}
app.auth.jwtIssuer=${JWT_ISSUER:productstore}
app.auth.jwtAudience=${JWT_AUDIENCE:productstore-web}
app.auth.jwt-ttl-hours=${APP_JWT_TTL_HOURS:12}

# Local SMTP (use MailHog or similar)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.email.domain=${EMAIL_DOMAIN:}
app.email.from=${EMAIL_FROM:no-reply@localhost}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
sendgrid.apiKey=${SENDGRID_API_KEY:}
app.twilio.sendgrid.api-url=${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
app.twilio.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Platform admin only. Demo merchant/client seed is SIT-only (application-sit.properties).
app.bootstrap.platformAdmin.email=${PLATFORM_ADMIN_EMAIL:admin@localhost}
app.bootstrap.platformAdmin.password=${PLATFORM_ADMIN_PASSWORD:Admin@123456}
# Set true once to reset seed password on an existing admin user, then turn off.
app.bootstrap.platformAdmin.syncPassword=${PLATFORM_ADMIN_SYNC_PASSWORD:false}
app.bootstrap.demoMerchant.enabled=false
app.bootstrap.demoClient.enabled=false

app.public-base-url=http://localhost:8080
app.frontend-base-url=${PUBLIC_APP_BASE_URL:http://localhost:8085}
app.password-reset.token-ttl-hours=${PASSWORD_RESET_TOKEN_TTL_HOURS:24}


# Paystack online payments (card and Instant EFT). The secret key also verifies webhooks.
paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}

# Local SQL echo (base profile keeps this off)
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
