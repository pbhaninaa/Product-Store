# PROD — live (Railway). Required env: MySQL via SPRING_DATASOURCE_* or MYSQL*,
# APP_JWT_SECRET, PROD_CORS_ORIGINS, PUBLIC_BASE_URL, SENDGRID_API_KEY, EMAIL_DOMAIN.
# SPRING_DATASOURCE_URL must be jdbc:mysql://... (not mysql://). Prefer MYSQLHOST if unsure.

server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# MySQL (Railway MySQL plugin MYSQL* vars, or explicit SPRING_DATASOURCE_*)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# MarketPlace-compatible: APP_JWT_SECRET (JWT_SECRET still accepted as fallback)
app.auth.jwtSecret=${APP_JWT_SECRET:${JWT_SECRET}}
app.auth.jwtIssuer=${JWT_ISSUER:productstore}
app.auth.jwtAudience=${JWT_AUDIENCE:productstore-web}

app.cors.allowed-origins=${PROD_CORS_ORIGINS}

# SendGrid
app.email.domain=${EMAIL_DOMAIN:}
app.email.from=${EMAIL_FROM:no-reply@yourdomain.com}
sendgrid.apiKey=${SENDGRID_API_KEY}
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.twilio.sendgrid.api-url=${SENDGRID_API_URL:https://api.sendgrid.com/v3/mail/send}
app.twilio.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# PUBLIC_BASE_URL = backend public origin (uploads / EFT proofs). No trailing slash.
# PUBLIC_APP_BASE_URL = frontend (Vercel) — MarketPlace-compatible name for the SPA.
app.public-base-url=${PUBLIC_BASE_URL}
app.frontend-base-url=${PUBLIC_APP_BASE_URL:}
app.password-reset.token-ttl-hours=${PASSWORD_RESET_TOKEN_TTL_HOURS:24}
app.uploads.dir=${UPLOADS_DIR:/app/data/uploads}
# Persist UPLOADS_DIR on a Railway volume. Proof PDFs go under uploads/_private/subscription-proofs (blocked from public static).
app.bootstrap.demoMerchant.enabled=false
# Seeded system admin (change password after first login). Merchants use /signup.
app.bootstrap.platformAdmin.email=${PLATFORM_ADMIN_EMAIL:pbhanina@gmail.com}
app.bootstrap.platformAdmin.password=${PLATFORM_ADMIN_PASSWORD:Philas@12}
app.bootstrap.platformAdmin.syncPassword=${PLATFORM_ADMIN_SYNC_PASSWORD:false}

# Optional: seed platform banking on first boot (otherwise set in Support → Subscriptions).
app.platform-banking.bank-name=${PLATFORM_BANK_NAME:}
app.platform-banking.account-name=${PLATFORM_BANK_ACCOUNT_NAME:}
app.platform-banking.account-number=${PLATFORM_BANK_ACCOUNT_NUMBER:}
app.platform-banking.branch-code=${PLATFORM_BANK_BRANCH_CODE:}
app.platform-banking.reference-hint=${PLATFORM_BANK_REFERENCE_HINT:}
app.platform-banking.payment-link=${PLATFORM_BANK_PAYMENT_LINK:}

logging.level.root=WARN
logging.level.com.productstore=INFO
logging.level.org.hibernate.SQL=WARN

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Keep DB off the default health aggregate so misconfigured probes don't 503 the deploy.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

peach.enabled=${PEACH_ENABLED:false}
peach.sandbox=${PEACH_SANDBOX:false}
peach.client-id=${PEACH_CLIENT_ID:}
peach.client-secret=${PEACH_CLIENT_SECRET:}
peach.merchant-id=${PEACH_MERCHANT_ID:}
peach.entity-id=${PEACH_ENTITY_ID:}
peach.secret-token=${PEACH_SECRET_TOKEN:${PEACH_WEBHOOK_SECRET:}}
