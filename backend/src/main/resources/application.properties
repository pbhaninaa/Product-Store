# -----------------------------
# App
# -----------------------------
spring.application.name=platform
spring.profiles.active=local

# -----------------------------
# Server
# -----------------------------
server.port=${PORT:8080}

# -----------------------------
# Datasource (EDIT THESE)
# -----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/platform_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# JPA / Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# UUID handling
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# -----------------------------
# File Upload Limits
# -----------------------------
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

# -----------------------------
# File Storage (Recommended)
# -----------------------------
app.public-base-url=http://localhost:8080
app.uploads.dir=./data/uploads

# -----------------------------
# Logging (optional but useful)
# -----------------------------
logging.level.org.hibernate.SQL=WARN
# -----------------------------
# Paystack online payments (card and Instant EFT). The secret key also verifies webhooks.
# Set the webhook URL in the Paystack dashboard to {backend}/api/payments/paystack/webhook.
# -----------------------------
paystack.enabled=${PAYSTACK_ENABLED:false}
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
# Shown on every Paystack charge so the dashboard can tell this app apart from other systems on the same account.
paystack.system-name=${PAYSTACK_SYSTEM_NAME:ProductStore}
# A Paystack verify answer is reused this long per reference (return page polling, reconciliation).
paystack.verify-cache-ttl=${PAYSTACK_VERIFY_CACHE_TTL:PT10S}

# The Paystack account is shared, so webhooks may never reach this app: pending online payments started in
# the last 24 hours are confirmed with Paystack by this job instead (oldest first, a bounded batch per run).
app.payments.reconcile-enabled=${PAYMENTS_RECONCILE_ENABLED:true}
app.payments.reconcile-interval=${PAYMENTS_RECONCILE_INTERVAL:PT2M}
app.payments.reconcile-batch-size=${PAYMENTS_RECONCILE_BATCH_SIZE:50}

# Demo switch: hide and reject online payment for every shop; cash only.
app.payments.customer-cash-only=${CUSTOMER_PAYMENTS_CASH_ONLY:false}

# Unpaid orders are cancelled after these times so they stop holding stock and promotion uses.
# Legacy Manual EFT orders (removed 2026-11-23) still awaiting proof expire after eft-awaiting-proof;
# those whose proof is awaiting the merchant's review never expire.
app.orders.unpaid-expiry.in-app=${UNPAID_EXPIRY_IN_APP:PT2H}
app.orders.unpaid-expiry.eft-awaiting-proof=${UNPAID_EXPIRY_EFT:PT48H}
app.orders.unpaid-expiry.cash=${UNPAID_EXPIRY_CASH:PT72H}

# Booking fee for pay-in-store salon bookings (docs/engineering/plans/booking-fee.md).
# Paystack's smallest ZAR charge in cents (R1.00); a smaller booking fee is not charged online.
paystack.minimum-charge-cents=${PAYSTACK_MINIMUM_CHARGE_CENTS:100}
# An unpaid booking fee cancels the booking after app.bookings.unpaid-fee-expiry (default: the in-app order expiry).
# Failed booking fee refunds are retried by this job (each refund backs off from 5 minutes to 6 hours).
app.booking-fee.refund-retry-enabled=${BOOKING_FEE_REFUND_RETRY_ENABLED:true}
app.booking-fee.refund-retry-interval=${BOOKING_FEE_REFUND_RETRY_INTERVAL:PT5M}
